<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>MediaFlow</title>
  <!-- WebView2 non mostra nessuna scheda, quindi questo titolo dentro la
       finestra non si vede: serve a chi apre il file in un browser per
       lavorarci sopra. -->
  <link rel="icon" href="../assets/MediaDex.png">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <!-- Sfondo: quattro strati sovrapposti, tutti generati dal CSS.
       Nessun file, nessun download, niente da inizializzare. -->
  <div class="sfondo" aria-hidden="true">
    <!-- Il video sta sopra i gradienti e sotto il velo. Se il file non c'e',
         l'elemento resta vuoto e si vedono i gradienti: non e' un ripiego
         mesto, e' uno sfondo a sua volta guardabile. -->
    <video id="video-sfondo" class="video-sfondo" autoplay muted loop playsinline></video>
    <div class="tinta-verde"></div>
    <div class="alone alone-1"></div>
    <div class="alone alone-2"></div>
    <div class="alone alone-3"></div>
    <div class="griglia"></div>
    <div class="grana"></div>
    <div class="vignetta"></div>
  </div>

  <!-- Le icone stanno qui una volta sola e si richiamano con <use>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-audio" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>
      </g>
      <g id="i-disco" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>
      </g>
      <g id="i-video" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
        <path d="M2.5 9.5h19M7 5v4.5M17 5v4.5M7 19v-4.5M17 19v-4.5M2.5 14.5h19"/>
      </g>
      <g id="i-forbici" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/>
        <path d="M20 4L8.5 15.5M14.5 14.5L20 20M8.5 8.5l3 3"/>
      </g>
      <g id="i-sottotitoli" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M6.5 12.5h4M13 12.5h4.5M6.5 15.5h7M15.5 15.5h2"/>
      </g>
      <g id="i-voce" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7"/>
      </g>
      <g id="i-cerca" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
      </g>
      <g id="i-scarica" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 19h16"/>
      </g>
      <g id="i-cartella" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V17a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      </g>
      <g id="i-vuoto" fill="none" stroke="currentColor" stroke-width="1.3"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M8.5 14.5h7"/>
      </g>
      <g id="i-lente" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M11 8.5v5M8.5 11h5"/>
      </g>
      <g id="i-avvia" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4.5l12 7.5-12 7.5z"/>
      </g>
      <g id="i-maniglia" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M8 7h8M8 12h8M8 17h8"/>
      </g>
      <!-- Le tre che servono alla finestra: un guaio, un errore, una conferma. -->
      <g id="i-avviso" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5L21.5 20h-19z"/><path d="M12 9.5v5M12 17.2v.3"/>
      </g>
      <g id="i-errore" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.3"/>
      </g>
      <g id="i-spunta" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12.5l5 5 10-11"/>
      </g>
    </defs>
  </svg>

  <div class="guscio">

    <aside class="barra">
      <!-- Il marchio: un play con tre scie, cioe' «audio e video che
           scorrono» - il nome MediaFlow disegnato - coi verdi del tema.

           E' lo stesso segno dell'icona sul desktop, cosi' chi ha appena
           fatto doppio clic lo ritrova dentro la finestra.

           marchio.png, il .ico e il .png dell'eseguibile escono tutti da
           assets/marchio.py: per ritoccarlo si cambia li' e si rilancia. -->
      <div class="marchio">
        <img class="marchio-icona" src="marchio.png" alt="" draggable="false">
        <div class="logo">Media<span class="logo-flow">Flow</span></div>
        <div class="motto">Tutto l'audio e il video, in un solo spazio.</div>
        <div class="spia-tor" id="spia-tor" data-fase="avvio">
          <span class="spia-tor-punto"></span><span class="spia-tor-testo"></span>
        </div>
        <!-- Si vede solo al primo avvio, mentre FFmpeg si scarica, o se non
             si e' riusciti a scaricarlo. -->
        <div class="spia-tor" id="spia-ffmpeg" data-fase="avvio" style="display: none">
          <span class="spia-tor-punto"></span><span class="spia-tor-testo"></span>
        </div>
      </div>

      <!-- Sei stanze, e in ciascuna c'e' tutto il lavoro di quel mestiere:
           il modulo, l'avanzamento, il risultato. La targhetta a destra della
           voce dice se li' dentro sta girando qualcosa: e' l'unica cosa che si
           vede da fuori, e serve proprio perche' un lavoro alla volta puo'
           essere partito in una stanza in cui adesso non si sta. -->
      <nav class="menu">
        <button class="voce attiva" data-va="audio">
          <span class="rotaia"></span>
          <svg class="icona" viewBox="0 0 24 24"><use href="#i-audio"/></svg>
          <span data-t="menu.audio"></span>
          <span class="targhetta-menu spenta" data-targhetta="audio"></span>
        </button>
        <button class="voce" data-va="burn">
          <span class="rotaia"></span>
          <svg class="icona" viewBox="0 0 24 24"><use href="#i-disco"/></svg>
          <span data-t="menu.burn"></span>
          <span class="targhetta-menu spenta" data-targhetta="burn"></span>
        </button>
        <button class="voce" data-va="video">
          <span class="rotaia"></span>
          <svg class="icona" viewBox="0 0 24 24"><use href="#i-video"/></svg>
          <span data-t="menu.video"></span>
          <span class="targhetta-menu spenta" data-targhetta="video"></span>
        </button>
        <button class="voce" data-va="pix">
          <span class="rotaia"></span>
          <svg class="icona" viewBox="0 0 24 24"><use href="#i-lente"/></svg>
          <span data-t="menu.pix"></span>
          <span class="targhetta-menu spenta" data-targhetta="pix"></span>
        </button>
        <button class="voce" data-va="sub">
          <span class="rotaia"></span>
          <svg class="icona" viewBox="0 0 24 24"><use href="#i-sottotitoli"/></svg>
          <span data-t="menu.sub"></span>
          <span class="targhetta-menu spenta" data-targhetta="sub"></span>
        </button>
        <button class="voce" data-va="dop">
          <span class="rotaia"></span>
          <svg class="icona" viewBox="0 0 24 24"><use href="#i-voce"/></svg>
          <span data-t="menu.dop"></span>
          <span class="targhetta-menu spenta" data-targhetta="dop"></span>
        </button>
        <!-- Montaggio non e' una stanza sola: si apre a tendina, e ogni voce
             sotto e' un'operazione con la sua pagina. -->
        <button class="voce voce-gruppo" data-gruppo="clip" aria-expanded="false">
          <span class="rotaia"></span>
          <svg class="icona" viewBox="0 0 24 24"><use href="#i-forbici"/></svg>
          <span data-t="menu.clip"></span>
          <span class="targhetta-menu spenta" data-targhetta="clip"></span>
          <svg class="freccia" viewBox="0 0 24 24"><path d="M8 10l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="sottomenu" data-di="clip">
          <button class="voce sotto" data-va="clip" data-op="gif">
            <span class="rotaia"></span>
            <span data-t="menu.clip.gif"></span>
          </button>
          <button class="voce sotto" data-va="clip" data-op="taglia">
            <span class="rotaia"></span>
            <span data-t="menu.clip.taglia"></span>
          </button>
          <button class="voce sotto" data-va="clip" data-op="unisci">
            <span class="rotaia"></span>
            <span data-t="menu.clip.unisci"></span>
          </button>
          <button class="voce sotto" data-va="clip" data-op="webp">
            <span class="rotaia"></span>
            <span data-t="menu.clip.webp"></span>
          </button>
        </div>
      </nav>

    </aside>

    <main class="corpo">

      <!-- ══ AUDIO ══════════════════════════════════════════════════════ -->
      <!-- Solo un link e Scarica. Se il link e' una playlist o un album si
           apre una finestra coi brani da spuntare; se e' un brano solo parte e
           basta. Sotto, man mano, quello che e' stato scaricato. -->
      <div class="sezione attiva" data-sez="audio">
        <header class="intestazione">
          <h1 data-t="audio.title"></h1>
          <p data-t="audio.desc"></p>
        </header>
        <hr class="divisore">

        <section class="vetro">
          <div class="riga">
            <div class="gruppo largo">
              <label data-t="scarica.link"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
                <input id="a-link" class="campo con-icona" type="text" spellcheck="false"
                       placeholder="https://www.youtube.com/watch?v=…">
              </div>
            </div>
          </div>
          <div class="azioni">
            <div class="spazio"></div>
            <button id="a-scarica" class="bottone pieno">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-cerca"/></svg>
              <span data-t="scarica.analizza"></span>
            </button>
          </div>
        </section>

        <!-- L'avanzamento e' di questa sezione e resta qui: ogni stanza ha la
             sua barra, e chi vuole sapere dove sta girando il lavoro lo legge
             sulla targhetta nella barra laterale. -->
        <div class="avanzamento">
          <div class="binario"><div class="cursa"></div></div>
          <div class="avanzamento-testo"></div>
        </div>

        <section class="vetro colonna">
          <div class="titolo-pannello">
            <span class="spia"></span>
            <span data-t="scarica.risultati"></span>
            <span class="stato"></span>
          </div>
          <div id="a-risultati" class="elenco"></div>
        </section>
      </div>

      <!-- ══ VIDEO ══════════════════════════════════════════════════════ -->
      <!-- Come Audio, ma per i video: a sinistra si guarda quello che e'
           stato scaricato, a destra l'elenco. -->
      <div class="sezione" data-sez="video">
        <header class="intestazione">
          <h1 data-t="video.title"></h1>
          <p data-t="video.desc"></p>
        </header>
        <hr class="divisore">

        <section class="vetro">
          <div class="riga">
            <div class="gruppo largo">
              <label data-t="video.link"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
                <input id="v-link" class="campo con-icona" type="text" spellcheck="false"
                       placeholder="https://www.youtube.com/watch?v=…">
              </div>
            </div>
            <div class="gruppo stretto">
              <label data-t="audio.subs"></label>
              <select id="v-sottotitoli" class="campo">
                <option value="" data-t="audio.subs.no"></option>
                <option value="traccia" data-t="audio.subs.traccia"></option>
                <option value="impressi" data-t="audio.subs.impressi"></option>
              </select>
            </div>
            <div class="gruppo stretto" id="v-gruppo-traduci" hidden>
              <label data-t="audio.traduci"></label>
              <select id="v-traduci" class="campo">
                <option value="" data-t="audio.traduci.no"></option>
                <option value="en" data-t="audio.traduci.en"></option>
              </select>
            </div>
          </div>
          <div class="azioni">
            <div class="spazio"></div>
            <button id="v-scarica" class="bottone pieno">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-cerca"/></svg>
              <span data-t="scarica.analizza"></span>
            </button>
          </div>
        </section>

        <div class="avanzamento">
          <div class="binario"><div class="cursa"></div></div>
          <div class="avanzamento-testo"></div>
        </div>

        <!-- A sinistra tutto quello che e' stato chiesto, con lo stato di
             ciascuno; a destra solo quello che e' pronto, da aprire. -->
        <div class="v-doppia">
          <section class="vetro colonna">
            <div class="titolo-pannello">
              <span class="spia"></span>
              <span data-t="video.coda"></span>
              <span class="stato"></span>
            </div>
            <div id="v-risultati" class="elenco"></div>
          </section>
          <section class="vetro colonna">
            <div class="titolo-pannello">
              <span data-t="video.pronti"></span>
              <span id="v-conta" class="targhetta" hidden></span>
            </div>
            <div id="v-pronti" class="elenco"></div>
          </section>
        </div>
      </div>

      <!-- ══ MASTERIZZAZIONE ════════════════════════════════════════════ -->
      <div class="sezione" data-sez="burn">
        <header class="intestazione">
          <h1 data-t="burn.title"></h1>
          <p data-t="burn.desc"></p>
        </header>
        <hr class="divisore">

        <section class="vetro">
          <div class="riga">
            <div class="gruppo largo">
              <label data-t="burn.folder"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-cartella"/></svg>
                <input id="b-cartella" class="campo con-icona scelto" type="text" readonly>
              </div>
            </div>
          </div>
          <div class="azioni">
            <div class="spazio"></div>
            <button id="b-avvia" class="bottone pieno" disabled>
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-disco"/></svg>
              <span data-t="burn.start"></span>
            </button>
          </div>
        </section>

        <div class="avanzamento">
          <div class="binario"><div class="cursa"></div></div>
          <div class="avanzamento-testo"></div>
        </div>

        <section class="vetro colonna">
          <div class="titolo-pannello">
            <span class="spia"></span>
            <span data-t="burn.tracks"></span>
            <span class="stato"></span>
            <div class="spazio"></div>
            <span class="targhetta" id="b-capienza"></span>
          </div>
          <div class="capienza"><div class="capienza-piena" id="b-barra-cd"></div></div>
          <div class="nota-riga" id="b-criterio"></div>
          <div class="nota-riga" id="b-silenzi"></div>
          <div id="b-tracce" class="elenco"></div>
        </section>
      </div>

      <!-- ══ RIMASTERIZZA ═══════════════════════════════════════════════ -->
      <div class="sezione" data-sez="pix">
        <header class="intestazione">
          <h1 data-t="pix.title"></h1>
          <p data-t="pix.desc"></p>
        </header>
        <hr class="divisore">

        <section class="vetro">
          <!-- Il video si prende dal disco oppure da YouTube: incollato il
               link, si scarica in risultati/Video e si analizza da solo. -->
          <div class="riga">
            <div class="gruppo largo">
              <label data-t="pix.link"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
                <input id="p-link" class="campo con-icona" type="text" spellcheck="false"
                       placeholder="https://www.youtube.com/watch?v=…">
              </div>
            </div>
            <div class="gruppo gruppo-bottone">
              <button id="p-scarica" class="bottone contorno">
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
                <span data-t="pix.link.scarica"></span>
              </button>
            </div>
          </div>
          <div class="riga">
            <div class="gruppo largo">
              <label data-t="pix.file"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-video"/></svg>
                <input id="p-file" class="campo con-icona scelto" type="text" readonly>
              </div>
            </div>
            <div class="gruppo stretto">
              <label data-t="pix.preset"></label>
              <select id="p-preset" class="campo"></select>
            </div>
          </div>
          <div class="nota-riga" id="p-nota-preset"></div>
          <div class="gruppo" style="margin-bottom:var(--s3)">
            <label data-t="pix.resolution"></label>
            <div id="p-risoluzioni" class="scelte"></div>
          </div>
          <div class="interruttori">
            <label class="interruttore">
              <input type="checkbox" id="p-confronto" checked><span class="cursore"></span>
              <span data-t="pix.compare"></span>
            </label>
            <label class="interruttore">
              <input type="checkbox" id="p-gpu"><span class="cursore"></span>
              <span data-t="pix.gpu"></span>
            </label>
          </div>
          <div class="azioni">
            <button id="p-analizza" class="bottone contorno">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-lente"/></svg>
              <span data-t="pix.analyze"></span>
            </button>
            <div class="spazio"></div>
            <button id="p-avvia" class="bottone pieno" disabled>
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-avvia"/></svg>
              <span data-t="pix.start"></span>
            </button>
          </div>
        </section>

        <div class="avanzamento">
          <div class="binario"><div class="cursa"></div></div>
          <div class="avanzamento-testo"></div>
        </div>

        <div class="due-colonne">
          <section class="vetro colonna">
            <div class="titolo-pannello">
              <span class="spia"></span>
              <span data-t="pix.diagnosis"></span>
              <span class="stato"></span>
            </div>
            <div id="p-diagnosi" class="elenco"></div>
          </section>
          <section class="vetro colonna">
            <div class="titolo-pannello"><span data-t="pix.preview"></span></div>
            <div id="p-anteprima" class="anteprima"></div>
          </section>
        </div>
      </div>

      <!-- ══ MONTAGGIO ══════════════════════════════════════════════════ -->
      <div class="sezione" data-sez="clip">
        <!-- Titolo e descrizione cambiano con la sottovoce del menu scelta:
             GIF, Taglia, Unisci, WebP. -->
        <header class="intestazione">
          <h1 id="c-titolo"></h1>
          <p id="c-desc"></p>
        </header>
        <hr class="divisore">

        <section class="vetro">
          <div class="riga">
            <div class="gruppo largo">
              <label id="c-etichetta-file"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-video"/></svg>
                <input id="c-file" class="campo con-icona scelto" type="text" readonly>
              </div>
            </div>
          </div>
          <div class="riga" id="c-parametri"></div>
          <div class="interruttori" id="c-interruttori"></div>
          <div class="azioni">
            <div class="spazio"></div>
            <button id="c-avvia" class="bottone pieno">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-avvia"/></svg>
              <span data-t="clip.start"></span>
            </button>
          </div>
        </section>

        <div class="avanzamento">
          <div class="binario"><div class="cursa"></div></div>
          <div class="avanzamento-testo"></div>
        </div>

        <section class="vetro colonna">
          <div class="titolo-pannello">
            <span class="spia"></span>
            <span data-t="clip.result"></span>
            <span class="stato"></span>
          </div>
          <div id="c-risultato" class="anteprima"></div>
        </section>
      </div>

      <!-- ══ SOTTOTITOLI ═════════════════════════════════════════════════ -->
      <!-- A sinistra il video, coi sottotitoli disegnati dalla pagina e non
           dal lettore: cosi' una correzione si vede mentre la si scrive. A
           destra le battute, una riga per riquadro, col minutaggio. Un solo
           bottone: Aggiorna salva, rifa' la traduzione, le tracce nel file e
           la copia impressa. -->
      <div class="sezione" data-sez="sub">
        <header class="intestazione">
          <h1 data-t="sub.title"></h1>
          <p data-t="sub.desc"></p>
        </header>
        <hr class="divisore">

        <section class="vetro">
          <div class="riga">
            <div class="gruppo largo">
              <label data-t="sub.file"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-video"/></svg>
                <input id="s-file" class="campo con-icona scelto" type="text" readonly>
              </div>
            </div>
          </div>
          <div class="azioni">
            <span class="s-nota" id="s-nota"></span>
            <div class="spazio"></div>
            <button id="s-aggiorna" class="bottone pieno">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-avvia"/></svg>
              <span data-t="sub.update"></span>
            </button>
          </div>
        </section>

        <div class="avanzamento">
          <div class="binario"><div class="cursa"></div></div>
          <div class="avanzamento-testo"></div>
        </div>

        <div class="s-doppia">
          <section class="vetro colonna">
            <div class="titolo-pannello">
              <span class="spia"></span>
              <span id="s-nome"></span>
              <span class="stato"></span>
            </div>
            <div class="s-schermo" id="s-schermo"></div>
          </section>
          <section class="vetro colonna">
            <div class="titolo-pannello"><span data-t="sub.list"></span></div>
            <div class="s-elenco" id="s-elenco"></div>
          </section>
        </div>
      </div>

      <!-- ══ DOPPIAGGIO ═════════════════════════════════════════════════ -->
      <!-- Le battute di un video sottotitolato, e accanto a ciascuna il testo
           nuovo. Doppia fa dire il testo nuovo a chi parla, con la sua voce,
           in una copia a parte. -->
      <div class="sezione" data-sez="dop">
        <header class="intestazione">
          <h1 data-t="dop.title"></h1>
          <p data-t="dop.desc"></p>
        </header>
        <hr class="divisore">

        <section class="vetro">
          <div class="riga">
            <div class="gruppo largo">
              <label data-t="sub.file"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-video"/></svg>
                <input id="d-file" class="campo con-icona scelto" type="text" readonly>
              </div>
            </div>
          </div>
          <div class="azioni">
            <span class="s-nota" id="d-stima"></span>
            <div class="spazio"></div>
            <button id="d-avvia" class="bottone pieno">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-voce"/></svg>
              <span data-t="dop.start"></span>
            </button>
          </div>
        </section>

        <div class="avanzamento">
          <div class="binario"><div class="cursa"></div></div>
          <div class="avanzamento-testo"></div>
        </div>

        <div class="s-doppia">
          <section class="vetro colonna">
            <div class="titolo-pannello">
              <span class="spia"></span>
              <span id="d-nome"></span>
              <span class="stato"></span>
              <div class="spazio"></div>
              <button class="bottone nudo" id="d-vedi-originale" data-t="dop.originale" hidden></button>
              <button class="bottone nudo" id="d-vedi-doppiato" data-t="dop.doppiato" hidden></button>
            </div>
            <div class="s-schermo" id="d-schermo"></div>
          </section>
          <section class="vetro colonna">
            <div class="titolo-pannello"><span data-t="dop.list"></span></div>
            <div class="s-elenco" id="d-elenco"></div>
          </section>
        </div>
      </div>

    </main>
  </div>

  <!-- Qui c'era la scheda del diario, sotto le sezioni. E' stata tolta: era un
       muro di righe tecniche che raccontava lo stesso lavoro gia' raccontato,
       meglio, dalla barra di avanzamento. E quando qualcosa andava storto, la
       riga che contava finiva sepolta sotto le altre invece di farsi notare.
       Adesso quello che va bene lo dice un avviso qui sotto, e quello che va
       male lo dice la finestra: con scritto su quale file, di che si tratta, e
       il testo tecnico sotto. Il diario completo continua a scriversi in
       logs/, dove serve davvero: a chi va a cercarlo dopo. -->
  <div class="avvisi" id="avvisi"></div>

  <div class="velo-trascina" id="velo-trascina">
    <div class="riquadro-trascina">
      <svg class="icona" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
      <span data-t="trascina"></span>
    </div>
  </div>

  <!-- La finestra modale e' una sola e viene riempita di volta in volta:
       un errore, un riepilogo, una conferma. Averne una per caso
       significherebbe quattro strutture da tenere allineate. -->
  <div class="velo-finestra" id="velo-finestra">
    <div class="finestra" id="finestra" role="dialog" aria-modal="true">
      <div class="finestra-testa">
        <svg class="icona" viewBox="0 0 24 24"><use href="#i-avviso" id="finestra-icona"/></svg>
        <h2 id="finestra-titolo"></h2>
      </div>
      <div class="finestra-corpo" id="finestra-corpo"></div>
      <div class="finestra-azioni" id="finestra-azioni"></div>
    </div>
  </div>

  <!-- Il velo di caricamento.
       Prende il testimone dalla schermata che PyInstaller mostra mentre
       scompatta l'eseguibile: quella sparisce quando la finestra compare,
       questo quando la pagina e' davvero pronta. Senza, in mezzo si vedrebbe
       per un istante l'interfaccia ancora vuota e senza traduzioni. -->
  <div class="velo-avvio" id="velo-avvio">
    <div class="avvio-blocco">
      <img class="avvio-marchio" src="marchio.png" alt="" draggable="false">
      <div class="avvio-nome">Media<span class="logo-flow">Flow</span></div>
      <div class="avvio-motto">Tutto l'audio e il video, in un solo spazio.</div>
      <div class="avvio-barra"><span></span></div>
    </div>
  </div>

  <script src="components/dropdown.js"></script>
  <script src="components/modal.js"></script>
  <script src="app.js"></script>
  <script src="features/audio.js"></script>
  <script src="features/burn.js"></script>
  <script src="features/pix.js"></script>
  <script src="features/clip.js"></script>
  <script src="features/sottotitoli.js"></script>
  <script src="features/doppiaggio.js"></script>
  <script>avvia();</script>
</body>
</html>
